<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Invitation</title>
    <link rel="stylesheet" href="syles.css" />
  </head>
  <body>
    <section class="invitation-card">
      
      <div class="card" id="year">
        <h1>2026</h1>
      </div>
      <div class="card" id="image1">
        <img src="./image/image1.avif" alt="" class="image" /></section>
        <section>
        <div class="invited">
          <h2 id="header">You are invited to</h2>
          <h1 class="party">New year party</h1>
          <article id="to-new-year">
            "Cheers to new beginnings and <br />
            brighter days in 2026!"
          </article>
          <p>WEDNESDAY</p>
          <div class="time">
            <span id="mounth"> DECEMBER</span>
            <span id="date"> 31</span>
            <span id="arrive">AT 8:30 PM</span>
          </div>
          <p class="place">kigali convention center</p>
          <button >RSVP Now to Celebrate!</button>
          <p class="respond">🥂Save Your Spot</p>
        </section>
        </div>
  </body>
</html>
